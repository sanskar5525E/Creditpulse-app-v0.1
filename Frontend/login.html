<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CreditPulse — Login</title>
    <meta name="theme-color" content="#0e1525" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="login-wrap">
      <div class="login-card">
        <div class="brand">
          <div class="brand-mark">₹</div>
          <h1>CreditPulse</h1>
        </div>
        <p class="sub">Sign in to your account</p>
        <div class="error" id="errorBox"></div>
        <form id="loginForm" autocomplete="off" novalidate>
          <div class="field">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" placeholder="you@company.com" required autocomplete="email" />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="password-field">
              <input type="password" id="password" name="password" placeholder="Your password" required autocomplete="current-password" />
              <button type="button" class="toggle-password" id="togglePassword" title="Show password">Show</button>
            </div>
          </div>
          <button type="submit" id="submitBtn">Sign in</button>
        </form>
        <div class="signup-row">
          New here?
          <button type="button" id="signUpBtn">Create an account</button>
        </div>
      </div>
    </div>
    <span id="eyeIcon" hidden></span>
    <script type="module" src="./login.js"></script>
  </body>
</html>
