<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CreditPulse — Login</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand">
        <div class="brand-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2 3 7v6c0 5 4 9 9 9s9-4 9-9V7l-9-5Z"></path>
            <path d="M9 12l2 2 4-4"></path>
          </svg>
        </div>
        <h1>CreditPulse</h1>
      </div>
      <p class="sub">Sign in to manage your customers</p>

      <div class="error" id="errorBox"></div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@company.com" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-field">
            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" id="submitBtn">Sign In</button>
      </form>

      <div class="signup-row">
        <span>New here?</span>
        <button type="button" id="signUpBtn">Sign Up</button>
      </div>
    </div>
  </div>

  <script type="module" src="/static/login.js"></script>
</body>
</html>
